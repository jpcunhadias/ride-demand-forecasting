# Local MLOps stack: MinIO (S3-compatible object storage), Postgres, an MLflow tracking
# server backed by both, and the prediction API. `docker compose up -d` needs no
# configuration; copy .env.example to .env to change credentials, ports or images.
#
# The pipeline itself runs on the host and talks to this stack:
#   uv run --env-file .env dvc repro
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rdf-local-only}
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing its own images in October 2025; Chainguard builds this
    # one from the same source. Only its `latest` tag is free to pull.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-rdf-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-rdf-local-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # Creates the buckets and exits. Written without a shell, which the Chainguard images
  # don't have; it simply retries until MinIO is accepting connections.
  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID:-rdf-local}:${AWS_SECRET_ACCESS_KEY:-rdf-local-only}@minio:9000
    command: mb --ignore-existing local/mlflow local/ride-demand-forecasting
    restart: on-failure

  mlflow:
    build: docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Artifacts go to MinIO through the tracking server, so clients only ever need its
    # URL - no storage credentials.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-rdf}:${POSTGRES_PASSWORD:-rdf-local-only}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mlflow:*}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rdf-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rdf-local-only}
    ports:
      # 5001 on the host: macOS keeps 5000 for AirPlay Receiver.
      - "${MLFLOW_PORT:-5001}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres-data:
  minio-data:
