[project]
name = "ride-demand-forecasting"
version = "0.1.0"
description = "Spatiotemporal ride-demand forecasting case study with a FastAPI prediction service"
readme = "README.md"
authors = [
    { name = "Joao Pedro Dias", email = "joaopedrocdias@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.2",
    "joblib>=1.5.2",
    "lightgbm>=4.5.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.12.4",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
# Only needed for the exploratory notebook (EDA plots, basemaps, OSM
# boundary lookups, the untuned baseline and XGBoost/time-series comparison
# points) - not required to train or serve the model, which ships tuned
# LightGBM (see the notebook's Model Validation section for why).
notebook = [
    "contextily>=1.7.1",
    "geopandas>=1.1.4",
    "geopy>=2.5.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "osmnx>=2.1.1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "xgboost>=3.4.1",
]

[project.scripts]
ride-demand-train = "ride_demand_forecasting.train:main"
ride-demand-ingest = "ride_demand_forecasting.ingest:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv]
# xgboost's Linux wheel unconditionally depends on nvidia-nccl-cu13 (a
# multi-GPU communication library, ~240MB) even though we only run CPU
# inference. Overriding it to an impossible marker drops it from the
# resolved lock/install entirely without affecting xgboost itself.
override-dependencies = ["nvidia-nccl-cu13; sys_platform == 'never'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
