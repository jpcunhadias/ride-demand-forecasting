name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ride-demand-forecasting .

      - name: Run container
        # No --rm here: if the container crashes on startup, we still want
        # `docker logs` below to have something to show instead of "No such
        # container" - it's removed explicitly in the cleanup step instead.
        run: docker run -d -p 8000:8000 --name rdf-smoke-test ride-demand-forecasting

      - name: Wait for startup and smoke-test the API
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Service is up"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Service never became healthy" >&2
              exit 1
            fi
            sleep 2
          done

          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"pickup_zone": 0, "hour": 12}'
          curl -sf 'http://localhost:8000/rankings?hour=12&top_n=3'

      - name: Show container logs
        if: always()
        run: docker logs rdf-smoke-test

      - name: Remove container
        if: always()
        run: docker rm -f rdf-smoke-test
